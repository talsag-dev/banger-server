services:
  - type: web
    name: banger-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Add your other environment variables in Render dashboard
      # or use sync: true to sync from .env file
    healthCheckPath: /api/auth/status
