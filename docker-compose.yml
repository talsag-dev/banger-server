services:
  postgres:
    image: postgres:15-alpine
    container_name: banger-postgres
    environment:
      POSTGRES_DB: banger_db
      POSTGRES_USER: banger_user
      POSTGRES_PASSWORD: banger_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  postgres_data:
